<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Style Lounge</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/adminstyle.css">
</head>
<body>
  <header class="admin-header">
    <h1><span class="SiteBrand">Style</span> Lounge — Admin</h1>
    <form action="/logout" method="POST">
      <button type="submit" class="btn-logout">Log ud</button>
    </form>
  </header>

  <main class="admin-main">

    <!-- Forsidetekst -->
    <section class="admin-card">
      <h2>Forsidetekst</h2>
      <form id="contentForm">
        <label>
          <span>Overskrift</span>
          <input type="text" id="welcomeTitle" name="welcomeTitle" required>
        </label>

        <label>
          <span>Første tekst</span>
          <textarea id="welcomeText1" name="welcomeText1" rows="5" required></textarea>
        </label>

        <label>
          <span>Anden tekst</span>
          <textarea id="welcomeText2" name="welcomeText2" rows="5" required></textarea>
        </label>

        <button type="submit" class="btn-primary">Gem ændringer</button>
      </form>
      <p id="saveMessage" class="save-msg"></p>
    </section>

    <!-- Tilføj produkt -->
    <section class="admin-card">
      <h2>Tilføj produkt</h2>
      <form id="productForm">
        <label>
          <span>Navn</span>
          <input type="text" id="productName" placeholder="fx Dameklip" required>
        </label>

        <label>
          <span>Pris</span>
          <input type="text" id="productPrice" placeholder="fx 475 kr eller Fra 750 kr" required>
        </label>

        <label>
          <span>Boks</span>
          <select id="productBox"></select>
        </label>

        <label>
          <span>Beskrivelse (valgfri — vises når man klikker på produktet)</span>
          <textarea id="productDescription" rows="3" placeholder="Skriv en beskrivelse her..."></textarea>
        </label>

        <button type="submit" class="btn-primary">Send til hjemmesiden</button>
      </form>
      <p id="productMessage" class="save-msg"></p>
    </section>

    <!-- Produktliste -->
    <section class="admin-card">
      <h2>Produkter på siden</h2>
      <div id="productList" class="product-list"></div>
    </section>

  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
